<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Asistencia Web</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #f4f6f8,
            #e8edf2
        );
}

.card {

    background: white;

    padding: 45px 35px;

    border-radius: 18px;

    text-align: center;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.12);

    width: 90%;

    max-width: 420px;
}

h1 {

    margin:
        0 0 12px 0;

    font-size: 30px;
}

p {

    color: #666;

    margin:
        0 0 30px 0;

    font-size: 16px;
}

.btn {

    display: inline-block;

    padding:
        15px 30px;

    background: #222;

    color: white;

    text-decoration: none;

    border-radius: 9px;

    font-weight: bold;

    font-size: 16px;

    transition:
        transform .15s,
        opacity .15s;
}

.btn:hover {

    opacity: .85;

    transform:
        translateY(-2px);
}

.status {

    margin-top: 25px;

    font-size: 12px;

    color: #888;
}

</style>

</head>

<body>

<div class="card">

    <h1>
        Asistencia Web
    </h1>

    <p>
        Sistema de control de asistencia
    </p>

    <a
        class="btn"
        href="https://earrings-sandwich-him-mom.trycloudflare.com/login.php"
    >
        ACCEDER AL SISTEMA
    </a>

    <div class="status">
        Sistema disponible
    </div>

</div>

</body>

</html>
